
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPoint - Detalhes do Ponto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>GeoPoint</h1>

        <nav>
            <a href="index.html">Pontos</a>
            <a href="formulario.html">Cadastrar</a>
        </nav>
    </header>

    <main>
        <section class="secao-detalhes">

            <div class="titulo-pagina">
                <h2>Detalhes do Ponto Geográfico</h2>
                <p>Confira as informações do ponto selecionado.</p>
            </div>

            <div id="mensagem-ponto"></div>

            <div id="detalhes-ponto">

                <div class="campo">
                    <strong>Nome:</strong>
                    <p id="nome-ponto">Carregando...</p>
                </div>

                <div class="campo">
                    <strong>Descrição:</strong>
                    <p id="descricao-ponto">Carregando...</p>
                </div>

                <div class="campo">
                    <strong>Latitude:</strong>
                    <p id="latitude-ponto">Carregando...</p>
                </div>

                <div class="campo">
                    <strong>Longitude:</strong>
                    <p id="longitude-ponto">Carregando...</p>
                </div>

            </div>

            <div class="botoes">
                <a href="index.html">Voltar</a>
                <a id="botao-editar" href="#">Editar</a>
                <button id="botao-excluir" type="button">Excluir</button>
            </div>

        </section>
    </main>

    <div id="modal-exclusao" class="modal" hidden>
    <div class="modal-conteudo">
        <h2>Excluir ponto geográfico</h2>
        <p>Tem certeza que deseja excluir este ponto?</p>

        <div class="modal-botoes">
            <button id="cancelar-exclusao" type="button">Cancelar</button>
            <button id="confirmar-exclusao" type="button">Excluir</button>
        </div>
    </div>
</div>

    <script src="js/api.js"></script>
    <script src="js/detalhe.js"></script>

</body>
</html>
