
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPoint - Cadastrar Ponto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>GeoPoint</h1>

        <nav>
            <a href="index.html">Pontos</a>
            <a href="formulario.html">Cadastrar</a>
        </nav>
    </header>

    <main>
        <section class="secao-formulario">

            <div class="titulo-pagina">
                <h2>Cadastrar Ponto Geográfico</h2>
                <p>Preencha os dados para adicionar um novo ponto.</p>
            </div>

            <form id="form-ponto" novalidate>

                <div class="campo">
                    <label for="name">Nome do ponto:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        required
                    >
                    <small id="erro-name" class="mensagem-erro"></small>
                </div>

                <div class="campo">
                    <label for="description">Descrição:</label>
                    <textarea
                        id="description"
                        name="description"
                        maxlength="255"
                        rows="4"
                    ></textarea>
                </div>

                <small id="erro-description" class="mensagem-erro"></small>

                <div class="campo">
                    <label for="latitude">Latitude:</label>
                    <input
                        type="number"
                        id="latitude"
                        name="latitude"
                        min="-90"
                        max="90"
                        step="any"
                        required
                    >
                    <small id="erro-latitude" class="mensagem-erro"></small>
                </div>

                <div class="campo">
                    <label for="longitude">Longitude:</label>
                    <input
                        type="number"
                        id="longitude"
                        name="longitude"
                        min="-180"
                        max="180"
                        step="any"
                        required
                    >
                    <small id="erro-longitude" class="mensagem-erro"></small>
                </div>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <a href="index.html">Cancelar</a>
                </div>

            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/formulario.js"></script>

</body>
</html>
