<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pontos Geográficos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section>
            <h2>Cadastrar Pontos Geográficos</h2>

            <form id="form-ponto">
                <div class="campo">
                    <label for="name">Nome do ponto:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="description">Descrição:</label>
                    <textarea
                        id="description"
                        name="description"
                        maxlength="255"
                        rows="4"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="latitude">Latitude:</label>
                    <input
                        type="number"
                        id="latitude"
                        name="latitude"
                        min="-90"
                        max="90"
                        step="any"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="longitude">Longitude:</label>
                    <input
                        type="number"
                        id="longitude"
                        name="longitude"
                        min="-180"
                        max="180"
                        step="any"
                        required
                    >
                </div>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <a href="index.html">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/formulario.js"></script>
</body>
</html>
