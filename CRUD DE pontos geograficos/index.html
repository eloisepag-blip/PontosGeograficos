<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPoint - Pontos Geográficos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>GeoPoint</h1>

        <nav>
            <a href="index.html">Pontos</a>
            <a href="formulario.html">Cadastrar</a>
        </nav>
    </header>

    <main>
        <section class="secao-pontos">

            <div class="titulo-pagina">
                <h2>Pontos Geográficos</h2>
                <p>Visualize e gerencie seus pontos geográficos.</p>
            </div>

            <div class="area-mapa">
                <h3>Mapa de localização</h3>
                <p>Os pontos geográficos poderão ser visualizados nesta área.</p>
            </div>

            <div class="barra-acoes">

                <div class="Pesquisa">
                    <label for="buscar-pontos">Pesquisar ponto:</label>
                    <input
                        type="search"
                        id="buscar-pontos"
                        placeholder="Digite o nome do ponto"
                    >
                </div>

                <a href="formulario.html" class="botao-cadastrar">
                    + Cadastrar ponto
                </a>

            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-pontos"></tbody>
                </table>
            </div>

            <p id="mensagem-pontos"></p>

        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/lista.js"></script>

</body>
</html>
